trigger:
  branches:
    include: [main]
  paths:
    include: ['tasks/04-azure-workload/terraform/*']

pr:
  branches:
    include: [main]
  paths:
    include: ['tasks/04-azure-workload/terraform/*']

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      curl -sLo terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
      unzip -o terraform.zip
      sudo mv terraform /usr/local/bin/
      terraform -version
    displayName: 'Install Terraform'

  - task: AzureCLI@2
    displayName: 'Terraform Init, Plan, and Apply'
    inputs:
      azureSubscription: 'multicloud-portfolio-azure'
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: 'tasks/04-azure-workload/terraform'
      inlineScript: |
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_TENANT_ID=$tenantId
        export ARM_OIDC_TOKEN=$idToken
        export ARM_USE_OIDC=true
        export ARM_SUBSCRIPTION_ID="81197388-0d27-49a4-a47d-91730e333ca2"

        # Separate, narrowly-scoped AWS credentials -- needed only to reach
        # the shared Terraform state backend (S3 + DynamoDB), which lives in
        # AWS regardless of which cloud a given task's resources are in.
        # Not OIDC-federated like the GitHub Actions side, due to time
        # constraints (Azure credits expiring) -- a real, acknowledged
        # trade-off, scoped to state-bucket-only permissions on a dedicated
        # IAM user rather than reusing any broader credential.
        export AWS_ACCESS_KEY_ID="$(AWS_ACCESS_KEY_ID)"
        export AWS_SECRET_ACCESS_KEY="$(AWS_SECRET_ACCESS_KEY)"
        export AWS_DEFAULT_REGION="eu-west-2"

        terraform init
        terraform plan -out=tfplan

        if [ "$(Build.Reason)" != "PullRequest" ]; then
          echo "Merged to main -- applying"
          terraform apply -auto-approve tfplan
        else
          echo "Pull request -- plan only, not applying"
        fi
