trigger:
  branches:
    include: [main]
  paths:
    include: ['tasks/04-azure-workload/terraform/*']

pr:
  branches:
    include: [main]
  paths:
    include: ['tasks/04-azure-workload/terraform/*']

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: AzureCLI@2
    displayName: 'Terraform Init, Plan, and Apply'
    inputs:
      azureSubscription: 'multicloud-portfolio-azure'
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: 'tasks/04-azure-workload/terraform'
      inlineScript: |
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_TENANT_ID=$tenantId
        export ARM_OIDC_TOKEN=$idToken
        export ARM_USE_OIDC=true
        export ARM_SUBSCRIPTION_ID="81197388-0d27-49a4-a47d-91730e333ca2"

        terraform init
        terraform plan -out=tfplan

        if [ "$(Build.Reason)" != "PullRequest" ]; then
          echo "Merged to main -- applying"
          terraform apply -auto-approve tfplan
        else
          echo "Pull request -- plan only, not applying"
        fi
